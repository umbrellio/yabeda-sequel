name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  rspec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The gem leans on private pool API, so every supported Ruby and both
        # Sequel ends get a run. The 5.60 column matters: it predates the
        # timed_queue pools entirely, so it exercises the legacy threaded pair
        # even on a Ruby that would otherwise default to timed_queue.
        ruby: ["3.1", "3.2", "3.3", "3.4", "4.0"]
        sequel: ["5.60.0", "latest"]
        exclude:
          # Sequel 5.60 predates Ruby 4.0 by years and nobody pairs them; the
          # 4.0 column is here because that is what the primary consumer runs.
          - ruby: "4.0"
            sequel: "5.60.0"
    name: rspec (ruby ${{ matrix.ruby }}, sequel ${{ matrix.sequel }})
    steps:
      - uses: actions/checkout@v4

      - name: Pin Sequel
        if: matrix.sequel != 'latest'
        run: echo 'gem "sequel", "${{ matrix.sequel }}"' >> Gemfile

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - run: bundle exec rspec

  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - run: bundle exec rubocop
