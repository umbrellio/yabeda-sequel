name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  rspec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.1 exercises the legacy threaded pools; the timed_queue pair only
        # exists from 3.2, and the gem leans on private pool API, so every
        # supported Ruby and both Sequel ends get a run.
        ruby: ["3.1", "3.2", "3.3", "3.4"]
        sequel: ["5.60.0", "latest"]
    name: rspec (ruby ${{ matrix.ruby }}, sequel ${{ matrix.sequel }})
    steps:
      - uses: actions/checkout@v4

      - name: Pin Sequel
        if: matrix.sequel != 'latest'
        run: echo 'gem "sequel", "${{ matrix.sequel }}"' >> Gemfile

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - run: bundle exec rspec

  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - run: bundle exec rubocop
